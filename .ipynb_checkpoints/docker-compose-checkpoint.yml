version: "3.9"

services:

  # =========================================================
  # BACKEND (FastAPI - AgriGuard API)
  # =========================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: agriguard-backend

    ports:
      - "8000:8000"

    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1

    volumes:
      - .:/app

    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    restart: unless-stopped


  # =========================================================
  # FRONTEND (Streamlit Dashboard)
  # =========================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: agriguard-frontend

    ports:
      - "8501:8501"

    environment:
      - BACKEND_URL=http://backend:8000

    depends_on:
      - backend

    volumes:
      - ./frontend:/app

    command: >
      streamlit run Home.py
      --server.port 8501
      --server.address 0.0.0.0

    restart: unless-stopped